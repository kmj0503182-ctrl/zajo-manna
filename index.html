        listContainer.innerHTML = filteredEvents.map(event => {

        const timeParts = event.time.split(':');
        const timeStr = timeParts[0] + timeParts[1] + '00'; 
        const endHour = String((parseInt(timeParts[0]) + 1) % 24).padStart(2, '0');
        const endTimeStr = endHour + timeParts[1] + '00';
        window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dateStr}T${timeStr}/${dateStr}T${endTimeStr}&details=${details}&location=${location}`, '_blank');
    }

    window.toggleFavorite = function(e, eventId) {
        e.stopPropagation();
        const index = state.favorites.indexOf(eventId);
        if (index > -1) state.favorites.splice(index, 1);
        else {
            state.favorites.push(eventId);
            e.currentTarget.querySelector('i').classList.add('heart-pop');
            setTimeout(() => e.currentTarget.querySelector('i').classList.remove('heart-pop'), 300);
        }
        if(state.currentTab === 'home') renderEventList();
        const detailHeart = document.getElementById(`detail-heart-${eventId}`);
        if(detailHeart) detailHeart.innerHTML = state.favorites.includes(eventId) ? '<i class="fa-solid fa-heart text-red-500 text-2xl"></i>' : '<i class="fa-regular fa-heart text-gray-400 text-2xl"></i>';
    }

    // ====== MAGAZINE LOGIC ======
    function renderMagazine() {
        sortContainer.style.display = 'none';
        fab.style.display = 'none';

        const listHtml = state.magazines.map(mag => `
            <div onclick="openMagazineDetail(${mag.id})" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden cursor-pointer hover:shadow-md transition-shadow active:scale-[0.98]">
                <img src="${mag.img}" alt="Magazine Cover" class="w-full h-36 object-cover">
                <div class="p-4">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold text-brand-600 bg-brand-50 px-2 py-1 rounded-md">${mag.category}</span>
                        <span class="text-gray-400 text-[10px]">${mag.date}</span>
                    </div>
                    <h3 class="font-bold text-gray-800 text-[15px] leading-snug mb-1 line-clamp-2">${mag.title}</h3>
                </div>
            </div>
        `).join('');

        mainContent.innerHTML = `
            <div class="p-5 pb-24">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-1">매거진</h2>
                        <p class="text-xs text-gray-500">당사자에게 꼭 필요한 정보들을 모았어요.</p>
                    </div>
                </div>
                <div class="space-y-4">
                    ${listHtml}
                </div>
            </div>
        `;
    }

    window.openMagazineDetail = function(id) {
        const mag = state.magazines.find(m => m.id === id);
        if(!mag) return;

        magazineDetailView.innerHTML = `
            <div class="bg-white px-5 py-4 border-b border-gray-100 flex justify-between items-center sticky top-0 z-10">
                <button onclick="closeMagazineDetail()" class="p-2 -ml-2 text-gray-600 hover:bg-gray-50 rounded-full"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                <div class="w-8"></div>
            </div>
            <div class="flex-1 overflow-y-auto pb-10 bg-white">
                <img src="${mag.img}" class="w-full h-52 object-cover">
                <div class="p-6">
                    <span class="text-xs font-bold text-brand-600 mb-3 block">${mag.category}</span>
                    <h2 class="text-2xl font-bold text-gray-800 leading-tight mb-4">${mag.title}</h2>
                    <span class="text-gray-400 text-xs mb-8 block pb-4 border-b border-gray-100">발행일: ${mag.date}</span>
                    
                    <div class="magazine-body text-gray-700 leading-relaxed text-[15px]">
                        ${mag.content}
                    </div>
                </div>
            </div>
        `;
        magazineDetailView.classList.add('active');
    }

    window.closeMagazineDetail = function() { magazineDetailView.classList.remove('active'); }

    // ====== MESSENGER LOGIC ======
    function renderMessenger() {
        sortContainer.style.display = 'none'; fab.style.display = 'none';
        const myChats = state.events.filter(e => state.joinedEvents.includes(e.id));
        let html = `<div class="p-5 h-full flex flex-col pb-24"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold text-gray-800">메신저</h2></div>`;
        if(myChats.length === 0) {
            html += `<div class="flex-1 flex flex-col items-center justify-center text-gray-400 mt-20"><i class="fa-regular fa-comments text-5xl mb-4 text-gray-300"></i><p class="text-sm">참여 중인 모임이 없습니다.</p></div>`;
        } else {
            html += `<div class="space-y-3">${myChats.map(event => {
                const style = getCategoryStyle(event.category);
                const chatHistory = state.chats[event.id] || [];
                const lastMsg = chatHistory.length > 0 ? chatHistory[chatHistory.length-1] : {text: '채팅을 시작해보세요.', time: ''};
                const badge = event.id === 1 ? `<div class="w-5 h-5 bg-red-500 rounded-full flex items-center justify-center text-white text-[10px] font-bold shadow-sm">2</div>` : '';
                return `
                    <div onclick="openChat(${event.id})" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center gap-4 cursor-pointer hover:bg-gray-50 active:scale-[0.98] transition-all">
                        <div class="w-14 h-14 ${style.bg} rounded-2xl flex items-center justify-center ${style.color} shrink-0 shadow-inner"><i class="fa-solid ${style.icon} text-2xl"></i></div>
                        <div class="flex-1 overflow-hidden"><div class="flex justify-between items-center mb-1"><h4 class="font-bold text-[15px] text-gray-800 truncate pr-2">${event.title}</h4><span class="text-[11px] text-gray-400 font-medium">${lastMsg.time}</span></div><p class="text-sm text-gray-500 truncate">${lastMsg.text}</p></div>
                        ${badge}
                    </div>`;
            }).join('')}</div>`;
        }
        mainContent.innerHTML = html + `</div>`;
    }

    let currentChatId = null;
    window.openChat = function(id) { currentChatId = id; renderChatMessages(); chatView.classList.add('active'); }
    window.closeChat = function() { chatView.classList.remove('active'); currentChatId = null; }

    function renderChatMessages() {
        const event = state.events.find(e => e.id === currentChatId);
        const messages = state.chats[currentChatId] || [];
        let msgHtml = messages.map(msg => {
            if (msg.sender === 'system') return `<div class="flex justify-center my-4"><span class="bg-gray-100 text-gray-500 text-xs px-3 py-1 rounded-full">${msg.text}</span></div>`;
            if (msg.sender === 'me') return `<div class="flex justify-end mb-4"><div class="flex items-end gap-2 max-w-[75%]"><span class="text-[10px] text-gray-400 mb-1 shrink-0">${msg.time}</span><div class="bg-brand-500 text-white p-3 rounded-2xl rounded-br-sm shadow-sm text-sm leading-relaxed">${msg.text}</div></div></div>`;
            return `<div class="flex items-start gap-2 mb-4 max-w-[85%]"><div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center text-gray-500 shrink-0 text-xs mt-1"><i class="fa-solid fa-user"></i></div><div class="flex flex-col gap-1"><span class="text-xs text-gray-500 ml-1 font-medium">${msg.name}</span><div class="flex items-end gap-2"><div class="bg-white border border-gray-100 p-3 rounded-2xl rounded-tl-sm shadow-sm text-gray-800 text-sm leading-relaxed">${msg.text}</div><span class="text-[10px] text-gray-400 mb-1 shrink-0">${msg.time}</span></div></div></div>`;
        }).join('');

        chatView.innerHTML = `
            <div class="bg-white/90 backdrop-blur-md px-5 py-4 border-b border-gray-100 flex justify-between items-center sticky top-0 z-20"><button onclick="closeChat()" class="p-2 -ml-2 text-gray-600 hover:bg-gray-100 rounded-full"><i class="fa-solid fa-arrow-left text-lg"></i></button><div class="flex flex-col items-center" onclick="openEventDetail(${event.id})"><div class="font-bold text-gray-800 text-base truncate max-w-[200px] hover:text-brand-500">${event.title}</div><div class="text-[10px] text-gray-500 font-medium">참여자 ${event.members}명</div></div><button class="p-2 -mr-2 text-gray-400"><i class="fa-solid fa-bars text-lg"></i></button></div>
            <div class="flex-1 overflow-y-auto p-4 bg-[#f8fafc]" id="chat-messages-container">${msgHtml}</div>
            <div class="bg-white border-t border-gray-100 p-3 pb-5 pb-safe fixed bottom-0 w-full max-w-[480px]">
                <form id="chat-form" onsubmit="sendMessage(event)" class="flex items-end gap-2">
                    <button type="button" class="p-3 text-gray-400 bg-gray-50 rounded-full"><i class="fa-solid fa-plus"></i></button>
                    <textarea id="chat-input" rows="1" class="flex-1 border border-gray-200 rounded-2xl py-3 px-4 text-sm focus:outline-none focus:border-brand-500 bg-gray-50 resize-none no-scrollbar" placeholder="메시지를 입력하세요..."></textarea>
                    <button type="submit" class="p-3 bg-brand-500 text-white rounded-full shadow-sm hover:bg-brand-600"><i class="fa-solid fa-paper-plane text-sm pl-0.5"></i></button>
                </form>
            </div>
        `;
        setTimeout(() => { const c = document.getElementById('chat-messages-container'); if(c) c.scrollTop = c.scrollHeight; }, 10);
    }

    window.sendMessage = function(e) {
        e.preventDefault(); const input = document.getElementById('chat-input'); const text = input.value.trim(); if(!text) return;
        const now = new Date(); const timeStr = `${now.getHours() >= 12 ? '오후' : '오전'} ${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2, '0')}`;
        state.chats[currentChatId] = state.chats[currentChatId] || [];
        state.chats[currentChatId].push({ sender: 'me', name: state.myUser.name, text, time: timeStr });
        input.value = ''; input.style.height = "auto"; renderChatMessages();
        setTimeout(() => {
            if (currentChatId) {
                const event = state.events.find(ev => ev.id === currentChatId);
                const botName = event.host === state.myUser.name ? '참여자' : event.host;
                state.chats[currentChatId].push({ sender: 'other', name: botName, text: "확인했습니다 😊", time: timeStr });
                renderChatMessages();
            }
        }, 1500);
    }

    // ====== MY PAGE LOGIC ======
    function renderMyPage() {
        sortContainer.style.display = 'none'; fab.style.display = 'none';
        let interestsHtml = state.myUser.interests.map(i => `<span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-1 rounded-md font-medium whitespace-nowrap">${i}</span>`).join('');
        mainContent.innerHTML = `
            <div class="p-5 pb-24">
                <div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold text-gray-800">마이페이지</h2><button class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-gear text-xl"></i></button></div>
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex items-center gap-5 mb-6 relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-32 h-32 bg-brand-50 rounded-full -mr-10 -mt-10 opacity-50"></div>
                    <div class="w-20 h-20 bg-brand-100 rounded-full flex items-center justify-center text-brand-500 text-3xl shadow-inner z-10 border-4 border-white shrink-0"><i class="fa-solid ${state.myUser.avatar}"></i></div>
                    <div class="z-10 flex-1">
                        <h3 class="font-bold text-xl text-gray-800 mb-1 flex items-center gap-2">${state.myUser.name} <button onclick="openProfileModal()" class="w-6 h-6 bg-gray-50 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-200"><i class="fa-solid fa-pen text-[10px]"></i></button></h3>
                        <p class="text-sm text-gray-500 mb-2"><i class="fa-solid fa-location-dot mr-1"></i>${state.myUser.location}</p>
                        <div class="flex gap-1 flex-wrap">${interestsHtml}</div>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div onclick="openJoinedEventsView()" class="bg-white rounded-2xl p-4 text-center shadow-sm border border-gray-50 hover:bg-gray-50 cursor-pointer active:scale-95"><i class="fa-solid fa-users text-brand-500 mb-2 text-lg"></i><p class="text-xs text-gray-500 mb-1 font-medium">참여 모임</p><p class="text-lg font-bold text-gray-800">${state.joinedEvents.length}</p></div>
                    <div onclick="openFavoriteEventsView()" class="bg-white rounded-2xl p-4 text-center shadow-sm border border-gray-50 hover:bg-gray-50 cursor-pointer active:scale-95"><i class="fa-solid fa-heart text-red-500 mb-2 text-lg"></i><p class="text-xs text-gray-500 mb-1 font-medium">찜한 모임</p><p class="text-lg font-bold text-gray-800">${state.favorites.length}</p></div>
                    <div onclick="openBadgeModal()" class="bg-brand-50 rounded-2xl p-4 text-center shadow-sm border border-brand-100 hover:bg-brand-100 cursor-pointer active:scale-95"><i class="fa-solid fa-medal text-yellow-500 mb-2 text-lg"></i><p class="text-xs text-brand-600 mb-1 font-bold">관심 뱃지</p><p class="text-lg font-bold text-brand-800">4</p></div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-4">
                    <h4 class="px-5 py-3 text-xs font-bold text-gray-400 bg-gray-50/50 uppercase tracking-wider">나의 활동</h4>
                    <button onclick="openMyEventsView()" class="w-full flex justify-between items-center p-5 border-b border-gray-50 hover:bg-gray-50"><span class="text-sm text-gray-700 font-medium flex items-center gap-3"><i class="fa-solid fa-list-check w-4 text-center text-gray-400"></i> 내가 만든 모임 관리</span><i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i></button>
                </div>
            </div>
        `;
    }

    // ====== TAB SWITCHING & MODALS ======
    function switchTab(tabId) {
        state.currentTab = tabId;
        navItems.forEach(item => {
            const icon = item.querySelector('i');
            if (item.dataset.tab === tabId) {
                item.classList.add('text-brand-600', 'font-semibold'); item.classList.remove('text-gray-400', 'hover:text-gray-600');
                if(icon.classList.contains('fa-regular')) { icon.classList.remove('fa-regular'); icon.classList.add('fa-solid'); }
            } else {
                item.classList.remove('text-brand-600', 'font-semibold'); item.classList.add('text-gray-400', 'hover:text-gray-600');
                if(icon.classList.contains('fa-solid') && item.dataset.tab !== 'home') { icon.classList.remove('fa-solid'); icon.classList.add('fa-regular'); }
            }
        });
        if (tabId === 'home') renderHome();
        else if (tabId === 'messenger') renderMessenger();
        else if (tabId === 'magazine') renderMagazine();
        else if (tabId === 'mypage') renderMyPage();
    }

    navItems.forEach(item => item.addEventListener('click', () => switchTab(item.dataset.tab)));
    sortSelect.addEventListener('change', (e) => { state.sortBy = e.target.value; if(state.currentTab === 'home') renderEventList(); });

    // Profile Modal
    window.openProfileModal = function() {
        document.getElementById('profile-name').value = state.myUser.name;
        document.getElementById('profile-location').value = state.myUser.location;
        document.getElementById('profile-interests-container').innerHTML = state.allCategories.map(cat => `<label class="cursor-pointer relative"><input type="checkbox" name="interest" value="${cat}" class="peer sr-only interest-cb" ${state.myUser.interests.includes(cat) ? 'checked' : ''}><div class="rounded-xl border border-gray-200 bg-white py-2 px-1 text-center text-[10px] text-gray-600 flex flex-col items-center gap-1"><i class="fa-solid ${getCategoryStyle(cat).icon} text-lg"></i>${cat}</div></label>`).join('');
        document.getElementById('profile-modal-overlay').classList.remove('hidden');
        document.getElementById('profile-modal-overlay').classList.add('flex');
        setTimeout(() => document.getElementById('profile-modal-content').classList.remove('translate-y-full'), 10);
    }
    window.closeProfileModal = function() {
        document.getElementById('profile-modal-content').classList.add('translate-y-full');
        setTimeout(() => { document.getElementById('profile-modal-overlay').classList.add('hidden'); document.getElementById('profile-modal-overlay').classList.remove('flex'); }, 300);
    }
    window.saveProfile = function(e) {
        e.preventDefault();
        state.myUser.name = document.getElementById('profile-name').value;
        state.myUser.location = document.getElementById('profile-location').value;
        const checked = Array.from(document.querySelectorAll('input[name="interest"]:checked')).map(cb => cb.value);
        state.myUser.interests = checked.length > 0 ? checked : ['예술/창작'];
        closeProfileModal(); renderMyPage();
    }

    // Event Management Views
    window.openMyEventsView = function() {
        const myEvents = state.events.filter(e => e.host === state.myUser.name);
        document.getElementById('my-events-list').innerHTML = myEvents.map(event => `<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col gap-3"><h4 class="font-bold text-gray-800 text-base">${event.title}</h4><div class="flex justify-end border-t border-gray-50 pt-2"><button onclick="openEditEventModal(${event.id})" class="px-4 py-2 bg-gray-100 text-gray-700 text-xs font-bold rounded-lg hover:bg-gray-200">수정하기</button></div></div>`).join('');
        document.getElementById('my-events-view').classList.add('active');
    }
    window.closeMyEventsView = function() { document.getElementById('my-events-view').classList.remove('active'); }
    
    // Add/Edit Event Modals
    window.openEventModal = function(editId = null) {
        document.getElementById('event-form').reset();
        document.getElementById('edit-event-id').value = '';
        if(editId) {
            const event = state.events.find(e => e.id === editId);
            if(event) {
                document.getElementById('edit-event-id').value = event.id;
                document.getElementById('event-title').value = event.title;
                document.getElementById('event-date').value = event.date;
                document.getElementById('event-time').value = event.time;
                document.getElementById('event-location').value = event.location;
                document.getElementById('event-category').value = event.category;
                document.getElementById('event-desc').value = event.description;
            }
        } else { document.getElementById('event-date').value = state.selectedDate; }
        document.getElementById('modal-overlay').classList.replace('hidden', 'flex');
        setTimeout(() => document.getElementById('modal-content').classList.remove('translate-y-full'), 10);
    }
    window.closeEventModal = function() {
        document.getElementById('modal-content').classList.add('translate-y-full');
        setTimeout(() => document.getElementById('modal-overlay').classList.replace('flex', 'hidden'), 300);
    }
    window.openEditEventModal = function(id) { openEventModal(id); }
    fab.addEventListener('click', () => openEventModal());
    document.getElementById('close-modal').addEventListener('click', closeEventModal);

    window.openBadgeModal = function() {
        const modal = document.getElementById('badge-modal-overlay');
        modal.classList.remove('hidden'); modal.classList.add('flex');
        setTimeout(() => {
            document.getElementById('badge-modal-content').classList.remove('scale-95', 'opacity-0');
            document.getElementById('badge-modal-content').classList.add('scale-100', 'opacity-100');
        }, 10);
    }
    window.closeBadgeModal = function() {
        document.getElementById('badge-modal-content').classList.remove('scale-100', 'opacity-100');
        document.getElementById('badge-modal-content').classList.add('scale-95', 'opacity-0');
        setTimeout(() => { document.getElementById('badge-modal-overlay').classList.add('hidden'); document.getElementById('badge-modal-overlay').classList.remove('flex'); }, 200);
    }

    // Initial Load
    switchTab('home');

</script>
</body>
</html>
